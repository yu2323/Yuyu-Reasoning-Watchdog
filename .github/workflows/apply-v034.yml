name: Apply Reasoning Watchdog v0.3.4

on:
  push:
    paths:
      - '.github/workflows/apply-v034.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3.4 source edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              "import { Popup, POPUP_TYPE, POPUP_RESULT } from '../../../popup.js';\n",
              "import { Popup, POPUP_TYPE, POPUP_RESULT } from '../../../popup.js';\nimport { createTopicDriftState, startTopicDrift, analyzeTopicDrift } from './topic-drift.js';\n",
              'topic drift import',
          )

          s = replace_once(
              s,
              "    truncation: { suspected: false, reason: '', finishReason: '' },\n    baselineAssistantId: null,",
              "    truncation: { suspected: false, reason: '', finishReason: '' },\n    drift: createTopicDriftState(),\n    baselineAssistantId: null,",
              'runtime drift state',
          )

          s = replace_once(
              s,
              "        runtime.analysis = analyzeReasoning(reasoning);\n        pushSample(runtime.analysis);\n        maybeToast(runtime.analysis);",
              "        runtime.analysis = analyzeReasoning(reasoning);\n        runtime.drift = analyzeTopicDrift(reasoning, runtime.drift, contentWords);\n        pushSample(runtime.analysis);\n        maybeToast(runtime.analysis);",
              'poll drift analysis',
          )

          s = replace_once(
              s,
              "    runtime.visibleTokenSeq++;\n    runtime.truncation = { suspected: false, reason: '', finishReason: '' };\n    const baseline = latestAssistantMessage();",
              "    runtime.visibleTokenSeq++;\n    runtime.truncation = { suspected: false, reason: '', finishReason: '' };\n    runtime.drift = startTopicDrift(contentWords);\n    const baseline = latestAssistantMessage();",
              'start drift anchor',
          )

          s = replace_once(
              s,
              "        runtime.lastReasoningChars = reasoningFromEvent.length;\n        runtime.analysis = analyzeReasoning(reasoningFromEvent);\n        pushSample(runtime.analysis);",
              "        runtime.lastReasoningChars = reasoningFromEvent.length;\n        runtime.analysis = analyzeReasoning(reasoningFromEvent);\n        runtime.drift = analyzeTopicDrift(reasoningFromEvent, runtime.drift, contentWords);\n        pushSample(runtime.analysis);",
              'finish drift analysis',
          )

          s = replace_once(
              s,
              "        score: runtime.analysis.score,\n        level: runtime.analysis.level,\n        durationMs: runtime.analysis.elapsedMs,",
              "        score: runtime.analysis.score,\n        level: runtime.analysis.level,\n        driftScore: runtime.drift?.score ?? 0,\n        driftLevel: runtime.drift?.level || 'unknown',\n        driftAffinity: runtime.drift?.affinity ?? 0,\n        driftDirectAffinity: runtime.drift?.directAffinity ?? 0,\n        driftChurn: runtime.drift?.churn ?? 0,\n        driftWindows: runtime.drift?.windowCount ?? 0,\n        driftAnchorSource: runtime.drift?.anchorSource || '',\n        durationMs: runtime.analysis.elapsedMs,",
              'history drift fields',
          )

          s = replace_once(
              s,
              "            <i class=\"yrw-usage-sep\"></i><b id=\"yrw-reasoning-main\">0 字符</b>\n",
              "            <i class=\"yrw-usage-sep\"></i><b id=\"yrw-reasoning-main\">0 字符</b>\n            <i class=\"yrw-usage-sep\"></i><b id=\"yrw-drift-main\">锚点 0 · 建立中</b>\n",
              'popup drift badge',
          )

          s = replace_once(
              s,
              "            runtime.visibleTokenCount = null;\n            runtime.truncation = { suspected: false, reason: '', finishReason: '' };",
              "            runtime.visibleTokenCount = null;\n            runtime.drift = createTopicDriftState();\n            runtime.truncation = { suspected: false, reason: '', finishReason: '' };",
              'reset drift state',
          )

          s = replace_once(
              s,
              "    const a = runtime.analysis || emptyAnalysis();\n    const level = a.level || 'normal';",
              "    const a = runtime.analysis || emptyAnalysis();\n    const d = runtime.drift || createTopicDriftState();\n    const level = a.level || 'normal';",
              'ui drift state',
          )

          s = replace_once(
              s,
              "            : `打开 Yuyu Watchdog · ${a.statusText || statusLabel(level)} · 回环 ${a.score || 0}`;",
              "            : `打开 Yuyu Watchdog · ${a.statusText || statusLabel(level)} · 回环 ${a.score || 0} · 锚点 ${d.score || 0}`;",
              'toolbar drift title',
          )

          s = replace_once(
              s,
              "    setText('yrw-reasoning-main', `${formatK(a.reasoningChars || 0)} 字符`);\n    const reported = readReportedThinkingTokens();",
              "    setText('yrw-reasoning-main', `${formatK(a.reasoningChars || 0)} 字符`);\n    setText('yrw-drift-main', `锚点 ${Math.round(d.score || 0)} · ${d.label || '建立中'}`);\n    const driftMain = q('yrw-drift-main');\n    if (driftMain) driftMain.title = `${d.note || ''}${d.anchorSource ? `｜锚点来源：${d.anchorSource}` : ''}`;\n    const reported = readReportedThinkingTokens();",
              'popup drift ui',
          )

          s = replace_once(
              s,
              "            runtime.lastReasoningChars = reasoning.length;\n            runtime.analysis = analyzeReasoning(reasoning);\n            if (Number.isFinite(Number(duration))",
              "            runtime.lastReasoningChars = reasoning.length;\n            runtime.analysis = analyzeReasoning(reasoning);\n            runtime.drift = analyzeTopicDrift(reasoning, runtime.drift, contentWords);\n            if (Number.isFinite(Number(duration))",
              'stream reasoning drift',
          )

          s = s.replace('v0.3.3', 'v0.3.4')
          p.write_text(s, encoding='utf-8')

          p = Path('settings.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v0.3.3 · 锚定题卡实验', 'v0.3.4 · Topic Drift 观察版')
          s = s.replace('单轮题卡实验', '锚点偏离实验')
          old_note = '本地实时读取 reasoning 并计算回环。v0.3.3 继承 v0.3.2 的状态/口径修正，只把固定题卡改成“本轮推进锚点”：阻止为了考虑周全不断开新支线、枚举远期后果和假设树；不改回环算法，也不自动停止生成。'
          new_note = '本地实时读取 reasoning。v0.3.4 保留原回环指数与 v0.3.3 锚定题卡，并新增独立 Topic Drift / 锚点偏离观察：比较本轮 USER、必要承接上下文、reasoning 起点与后续窗口的主题连续性。只显示“建立中 / 稳定 / 轻微偏离 / 明显跑远”，不并入回环分数，也不自动停止生成。'
          if old_note not in s:
              raise SystemExit('missing settings note')
          s = s.replace(old_note, new_note, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('manifest.json')
          s = p.read_text(encoding='utf-8').replace('"version": "0.3.3"', '"version": "0.3.4"')
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('当前版本：**v0.3.3**', '当前版本：**v0.3.4**', 1)
          ability = '- 实时读取 SillyTavern 可见 reasoning 文本，统计字符、5-gram 重复、信息新颖度、标题回环和综合回环指数。'
          if ability in s and '独立计算 Topic Drift' not in s:
              s = s.replace(ability, ability + '\n- 独立计算 Topic Drift / 锚点偏离：以本轮 USER、必要承接上下文和 reasoning 起点建立本地锚点，观察后续窗口是否持续远离；不并入回环指数。', 1)
          marker = '## v0.3.3 重点\n'
          section = '''## v0.3.4 Topic Drift 观察版\n\n- 保留 v0.3.3 锚定题卡、原回环算法、UI 基线和 warn-only 边界。\n- 新增独立 `topic-drift.js`：只在浏览器本地读取当前聊天与可见 reasoning，不额外调用模型。\n- 本轮锚点优先取最新 USER；当 USER 很短时，只补上一轮 assistant 正文尾部；reasoning 起始段作为第二锚点，避免“继续 / 然后呢”这类短输入失去上下文。\n- 后续 reasoning 按窗口观察锚点亲和度、持续丢失与主题换轨，输出 `建立中 / 稳定 / 轻微偏离 / 明显跑远`。\n- 锚点偏离是独立观察值，不写进原有回环指数，不触发 Toast 或 `stopGeneration()`。\n- 当前算法仍是本地词簇近似，不等于真正语义 embedding；本版目标是收集“回环正常但人工看已跑远”的实机样本。\n\n'''
          if marker not in s:
              raise SystemExit('missing README v0.3.3 marker')
          if '## v0.3.4 Topic Drift 观察版' not in s:
              s = s.replace(marker, section + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate plugin
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check topic-drift.js
          python -m json.tool manifest.json >/dev/null
          grep -q '"version": "0.3.4"' manifest.json
          grep -q "from './topic-drift.js'" index.js
          grep -q 'yrw-drift-main' index.js
          grep -q 'v0.3.4 · Topic Drift 观察版' settings.html
          grep -q '当前版本：\*\*v0.3.4\*\*' README.md

      - name: Commit release and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js topic-drift.js settings.html manifest.json README.md
          git rm .github/workflows/apply-v034.yml
          git commit -m 'release: Reasoning Watchdog v0.3.4 topic drift observer'
          git push origin HEAD:main
